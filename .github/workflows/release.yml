name: Publish signed APK

on:
  push:
    tags: ['[0-9]*-*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag, for example 20110-2.1.10"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^([0-9]+)-([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must use versionCode-versionName, for example 10000-1.0.0."
            exit 1
          fi
          version_code="${BASH_REMATCH[1]}"
          major="${BASH_REMATCH[2]}"
          minor="${BASH_REMATCH[3]}"
          patch="${BASH_REMATCH[4]}"
          suffix="${BASH_REMATCH[5]}"
          expected_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [[ "$version_code" -ne "$expected_code" ]]; then
            echo "::error::Tag versionCode ($version_code) does not match $major.$minor.$patch ($expected_code)."
            exit 1
          fi
          echo "version=$major.$minor.$patch$suffix" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install required Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test, lint and build unsigned release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: >-
          ./gradlew --no-daemon
          '-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8'
          --max-workers=2
          :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease
          :app:assembleRelease :app:assembleDebugAndroidTest
          :regression:assembleDebug :regression:assembleDebugAndroidTest

      - name: Stage unsigned APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/release/GeoLocation-"$APP_VERSION_NAME"-*.apk)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one versioned release APK, found ${#files[@]}."
            exit 1
          fi
          mkdir -p staging
          cp "${files[0]}" staging/unsigned.apk

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-release
          path: staging/unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-and-upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Install Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-release
          path: staging

      - name: Sign verified APK
        env:
          KEYSTORE_BASE64: ${{ secrets.GEOLOCATION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GEOLOCATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GEOLOCATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GEOLOCATION_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured. See docs/PUBLISHING.md."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/geolocation-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "GeoLocation-${{ needs.build.outputs.version }}.apk" \
            staging/unsigned.apk

      - name: Verify release signature and build type
        env:
          APK_PATH: GeoLocation-${{ needs.build.outputs.version }}.apk
          EXPECTED_CERT: cc5e95bcabbf19ad79992ffffbae77bf2dad5cafed01b4f3cd2c2e7213ec7633
        shell: bash
        run: |
          verification=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")
          actual=$(printf '%s\n' "$verification" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "$EXPECTED_CERT" || { echo '::error::Unexpected signing certificate'; exit 1; }
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")
          if grep -q 'application-debuggable' <<< "$badging"; then
            echo '::error::Debuggable APK cannot be released'; exit 1
          fi
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_PRERELEASE: ${{ contains(needs.build.outputs.version, '-') }}
          APK_PATH: GeoLocation-${{ needs.build.outputs.version }}.apk
        shell: bash
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true || {
              echo '::error::Published releases cannot be overwritten'; exit 1;
            }
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$APK_PATH.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" "$APK_PATH.sha256" \
              --verify-tag --draft --title "GeoLocation $VERSION" --generate-notes \
              --prerelease="$IS_PRERELEASE"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"
